<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShuX Control Panel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>ShuX</h1><p>Android Control Panel</p></header>
<main>
<section class="card">
<h2>Dashboard</h2>
<p>Welcome to ShuX Web Interface.</p>
<p>Status: <span class="badge">Interface ready</span></p>
</section>
<section class="card">
<h2>Device</h2>
<p id="device">Device information will appear here.</p>
<button onclick="checkStatus()">Check API</button>
<button onclick="loadDevices()">Refresh Devices</button>
<pre id="devices">اضغط Refresh Devices لعرض الأجهزة.</pre>

<p id="status">Not checked yet.</p>
</section>
</main>
<script>
async function checkStatus(){
const s=document.getElementById('status');
s.textContent='Checking...';
try{
const r=await fetch('/api/health');
const d=await r.json();
s.textContent=d.name+' — '+d.status;
}catch(e){s.textContent='API unavailable. Start ShuX first.';}
}
</script>

<script>
async function loadDevices() {
  const box = document.getElementById('devices');
  box.textContent = 'جارٍ تحميل الأجهزة...';

  try {
    const response = await fetch('/api/devices');
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || JSON.stringify(data));
    }

    box.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    box.textContent = 'فشل تحميل الأجهزة: ' + error.message;
  }
}
</script>

</body>
</html>
